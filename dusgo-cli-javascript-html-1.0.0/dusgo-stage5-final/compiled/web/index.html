<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>둣교 CLI</title>
<style>
  *{box-sizing:border-box} body{margin:0;background:#0b0e12;color:#e6edf3;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;display:grid;grid-template-rows:48px 1fr;height:100vh}
  header{display:flex;align-items:center;padding:0 14px;border-bottom:1px solid #202731;background:#10151b;gap:10px}
  header b{font-size:18px} header span{opacity:.55}
  button,input{font:inherit} button{background:#171d25;color:#e6edf3;border:1px solid #303a46;border-radius:6px;padding:7px 10px;cursor:pointer}button:hover{background:#202832}
  main{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:0}.side{border-right:1px solid #202731;background:#0f1318;padding:12px;overflow:auto}.group{margin-bottom:16px}.group strong{display:block;margin-bottom:7px;color:#9fb3c8}.file{display:block;width:100%;text-align:left;border:0;background:transparent;padding:4px 8px}.empty{opacity:.35;padding:4px 8px;display:block}
  .workspace{display:grid;grid-template-rows:42px minmax(200px,1fr) 220px;min-width:0}.bar{display:flex;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid #202731}.bar input{flex:1;min-width:100px;background:#0b0e12;border:1px solid #303a46;border-radius:6px;color:#e6edf3;padding:7px}
  #coding{width:100%;height:100%;resize:none;border:0;outline:0;background:#0b0e12;color:#d6deea;padding:14px;tab-size:1;white-space:pre;font:14px/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .bottom{display:grid;grid-template-rows:40px 1fr;border-top:1px solid #202731}.terminalHead{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#10151b}.terminalHead input{flex:1;background:#0b0e12;color:#e6edf3;border:1px solid #303a46;border-radius:6px;padding:7px}.terminal{padding:10px;overflow:auto;white-space:pre-wrap;color:#c9d1d9}
  @media(max-width:800px){main{grid-template-columns:1fr}.side{display:none}.workspace{grid-template-rows:42px minmax(200px,1fr) 240px}}
</style>
</head>
<body>
<header><b>둣교</b><span>Entry CLI</span><button id="newProject">새 Project</button><button id="check">검사</button><button id="run">실행</button><button id="save">저장</button><button id="entry">Entry 열기</button></header>
<main>
  <aside class="side"><div id="tree"></div><input id="assetInput" type="file" accept=".jpg,.jpeg,.png,.bmp,.svg,.eo,.mp3" multiple></aside>
  <section class="workspace">
    <div class="bar"><input id="projectName" value="Untitled" aria-label="Project name"><span> Coding/main.du</span></div>
    <textarea id="coding" spellcheck="false"></textarea>
    <div class="bottom"><div class="terminalHead"><span>Terminal</span><input id="command" placeholder="명령어를 입력하세요 — help"></div><div id="terminal" class="terminal"></div></div>
  </section>
</main>
<script src="dusgo.js"></script>
</body>
</html>
