name: Deploy Dusgo CLI to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "dusgo-cli-javascript-html-1.0.0/dusgo-stage5-final/compiled/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verify compiled web files
        shell: bash
        run: |
          set -e

          SITE_DIR="dusgo-cli-javascript-html-1.0.0/dusgo-stage5-final/compiled/web"

          test -d "$SITE_DIR"
          test -f "$SITE_DIR/index.html"
          test -f "$SITE_DIR/dusgo.js"

          echo "GitHub Pages source: $SITE_DIR"
          find "$SITE_DIR" -maxdepth 2 -type f -print | sort

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "dusgo-cli-javascript-html-1.0.0/dusgo-stage5-final/compiled/web"

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
