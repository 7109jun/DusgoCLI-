name: Deploy Dusgo CLI to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Find compiled site
        shell: bash
        run: |
          set -e

          CANDIDATE_1="dusgo-cli-javascript-html-1.0.0/dusgo-stage5-final/compiled"
          CANDIDATE_2="dusgo-cli-javascript-html-1.0.0/dusgo-stage5-final/dusgo-stage5-final/compiled"
          CANDIDATE_3="dusgo-stage5-final/compiled"

          if [ -f "$CANDIDATE_1/index.html" ]; then
            echo "PAGES_DIR=$CANDIDATE_1" >> "$GITHUB_ENV"
          elif [ -f "$CANDIDATE_2/index.html" ]; then
            echo "PAGES_DIR=$CANDIDATE_2" >> "$GITHUB_ENV"
          elif [ -f "$CANDIDATE_3/index.html" ]; then
            echo "PAGES_DIR=$CANDIDATE_3" >> "$GITHUB_ENV"
          else
            echo "ERROR: compiled/index.html not found."
            echo "Repository contents:"
            find . -maxdepth 6 -type f | sort
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.PAGES_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
