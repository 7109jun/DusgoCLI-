name: Deploy Dusgo CLI to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'dusgo-cli-javascript-html-1.0.0/dusgo-stage5-final/compiled/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Verify compiled site
        run: |
          test -d 'dusgo-cli-javascript-html-1.0.0/dusgo-stage5-final/compiled'
          test -f 'dusgo-cli-javascript-html-1.0.0/dusgo-stage5-final/compiled/index.html'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'dusgo-cli-javascript-html-1.0.0/dusgo-stage5-final/compiled'

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
